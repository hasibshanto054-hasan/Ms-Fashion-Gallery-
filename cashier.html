<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f766e">
<title>MS Cashier</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f4f6f8;--card:#fff;--tx:#14202b;--mut:#6b7a88;--pri:#0f766e;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--bd:#e3e8ee}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header b{font-size:16px}header small{opacity:.85;display:block;font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:#86efac;flex:none}.dot.off{background:#fca5a5}
main{padding:10px;max-width:640px;margin:0 auto;padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.inp,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#fff;color:var(--tx)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:var(--pri);color:#fff}
.btn.ok{background:var(--ok)}.btn.g{background:#e8edf2;color:var(--tx)}.btn.sm{width:auto;padding:8px 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fx{flex:0 0 auto}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.ci:last-child{border:0}
.ci .m{flex:1;min-width:0}.ci .m small{color:var(--mut)}
.q{display:flex;align-items:center;gap:8px;font-weight:700}.q button{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:#fff;font-size:18px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.b{font-size:20px;font-weight:800;color:var(--pri)}
.pill{background:#e8f3f1;color:var(--pri);border-radius:20px;padding:2px 8px;font-size:11px}
.res{border:1px solid var(--bd);border-radius:10px;margin-top:6px;overflow:hidden}.res div{padding:10px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px}.res div:last-child{border:0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:6}
nav button{flex:1;padding:12px 4px;border:0;background:none;font-size:13px;color:var(--mut)}nav button.on{color:var(--pri);font-weight:800}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;z-index:99;max-width:90%;text-align:center}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:14px;max-height:92vh;overflow:auto}
.rcpt{font-family:ui-monospace,monospace;font-size:13px;color:#000;width:100%;max-width:300px;margin:0 auto}.rcpt hr{border:0;border-top:1px dashed #000}.rcpt .r{display:flex;justify-content:space-between;gap:6px}
.login{max-width:380px;margin:12vh auto 0;padding:16px}.login h2{text-align:center;color:var(--pri)}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:72mm}header,nav,.toast{display:none}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="modal2"></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage;
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=x=>Math.round((+x||0)*100)/100,tk=n=>'৳'+bn(r2(n)),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const jget=(k,d)=>{try{const v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}};
const jset=(k,v)=>{try{LS.setItem(k,JSON.stringify(v))}catch(e){}};
const fdt=t=>new Date(t).toLocaleString('bn-BD',{dateStyle:'short',timeStyle:'short'});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---- cloud ---- */
const CLOUD={apiKey:'',dbUrl:''};
try{const x=new XMLHttpRequest();x.open('GET','cloud.json?'+Date.now(),false);x.send();if(x.status==200){const j=JSON.parse(x.responseText);if(j.apiKey)CLOUD.apiKey=j.apiKey;if(j.dbUrl)CLOUD.dbUrl=j.dbUrl;if(j.authBase)CLOUD.authBase=j.authBase;if(j.tokBase)CLOUD.tokBase=j.tokBase}}catch(e){}
const dbu=(p,tok)=>String(CLOUD.dbUrl).replace(/\/+$/,'')+'/'+p+'.json'+(tok?'?auth='+encodeURIComponent(tok):'');
const AUTH={tok:'',exp:0,rt:LS.getItem('cs_rt')||''};
async function signIn(user,pw){
  const base=CLOUD.authBase||'https://identitytoolkit.googleapis.com';
  const r=await fetch(base+'/v1/accounts:signInWithPassword?key='+encodeURIComponent(CLOUD.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:user+'@cashier.msf',password:pw,returnSecureToken:true})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'login failed');
  AUTH.tok=j.idToken;AUTH.exp=Date.now()+(Math.max(60,+j.expiresIn||3600)-60)*1000;AUTH.rt=j.refreshToken;LS.setItem('cs_rt',AUTH.rt);return j.localId;
}
async function tok(){
  if(AUTH.tok&&Date.now()<AUTH.exp)return AUTH.tok;
  if(!AUTH.rt)throw new Error('NOAUTH');
  const base=CLOUD.tokBase||'https://securetoken.googleapis.com';
  const r=await fetch(base+'/v1/token?key='+encodeURIComponent(CLOUD.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.rt)});
  const j=await r.json();if(!r.ok){const m=(j.error&&j.error.message)||'';const e=new Error(m||'token');e.fatal=/TOKEN_EXPIRED|USER_DISABLED|USER_NOT_FOUND|INVALID_REFRESH/.test(m);throw e}
  AUTH.tok=j.id_token;AUTH.exp=Date.now()+(Math.max(60,+j.expires_in||3600)-60)*1000;AUTH.rt=j.refresh_token||AUTH.rt;LS.setItem('cs_rt',AUTH.rt);return AUTH.tok;
}
async function dbGet(p){const r=await fetch(dbu(p,await tok()));if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function dbPut(p,v){const r=await fetch(dbu(p,await tok()),{method:'PUT',body:JSON.stringify(v)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

/* ---- state ---- */
let ME=jget('cs_me',null),CAT=jget('cs_cat',null),Q=jget('cs_q',[]),SL=jget('cs_sales',[]);
let tabN='sell',cart=[],pay={disc:0,method:'cash',cust:'',phone:''},srch='',online=navigator.onLine,busy=false;
const save=()=>{jset('cs_q',Q);jset('cs_sales',SL.slice(0,400))};
const br=()=>ME?ME.br:'';
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};

/* ---- catalog ---- */
const P=id=>CAT&&CAT.products.find(p=>p.i===id);
function bp(p){const b=(p.b||{})[br()]||(p.b||{})[CAT.main]||[0,0];return b}
function stockOf(p){let s=bp(p)[1];const v=CAT.v||0;SL.forEach(x=>{if(x.t>v&&!x.void)x.items.forEach(i=>{if(i.pid===p.i)s-=i.qty})});return s}
function findCode(c){
  c=String(c).trim();if(!c||!CAT)return null;
  const p=CAT.products.find(p=>(p.k||[]).includes(c));if(!p)return null;
  const u=(p.u||[]).find(u=>u.bc===c);return{p,u:u&&u.f>1?u:null};
}
function search(q){q=q.trim().toLowerCase();if(!q||!CAT)return[];return CAT.products.filter(p=>p.n.toLowerCase().includes(q)||(p.c||'').toLowerCase().includes(q)).slice(0,8)}
async function loadCat(){
  if(!ME)return;
  try{const c=await dbGet('cashierCat');if(c&&c.products){CAT=c;jset('cs_cat',c);if(tabN==='sell'&&!document.activeElement.matches('input'))render()}
    const me=await dbGet('cashiers/'+ME.uid);
    if(!me||me.active===false){toast('অ্যাকাউন্ট বন্ধ করা হয়েছে');return logout(true)}
    ME.name=me.name;ME.br=me.br;jset('cs_me',ME);online=true}
  catch(e){if(e.fatal)return logout(true);online=false}
  hdr();
}

/* ---- cart ---- */
function add(code,fromSearch){
  let r;
  if(fromSearch){const p=P(+code);if(!p)return;r={p,u:null}}else r=findCode(code);
  if(!r)return toast('❌ প্রোডাক্ট পাওয়া যায়নি: '+code);
  const p=r.p,u=r.u,f=u?u.f:1,un=u?u.n:'',base=bp(p)[0],price=u?(u.pr>0?u.pr:r2(f*base)):base;
  const it=cart.find(c=>c.pid===p.i&&c.f===f&&c.price===price);
  const used=sum(cart.filter(c=>c.pid===p.i),c=>c.qty*c.f)+f;
  if(used>stockOf(p)&&!confirm('স্টক নেই দেখাচ্ছে ('+bn(stockOf(p))+') — তবুও যোগ করবেন?'))return;
  it?it.qty++:cart.push({pid:p.i,name:p.n,qty:1,f,un,price});
  srch='';render();
}
function qty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);render()}
function price(i,v){cart[i].price=+v||0;render()}
const sub=()=>r2(sum(cart,c=>c.qty*c.price));
function scanBtn(){const el=$('#scan');const v=el.value.trim();el.value='';if(v)add(v);else toast('বারকোড নম্বর লিখুন')}
function scanKey(e){if(e.key==='Enter'){const v=e.target.value.trim();e.target.value='';if(v)add(v)}}
function srchIn(v){srch=v;const el=$('#sr');if(el)el.innerHTML=srHtml()}
const srHtml=()=>!srch.trim()?'':(search(srch).length?'':'<div style="color:var(--mut)">কিছু পাওয়া যায়নি</div>')+search(srch).map(p=>`<div onclick="add(${p.i},1)"><span>${esc(p.n)}<br><small style="color:var(--mut)">স্টক ${bn(stockOf(p))}</small></span><b>${tk(bp(p)[0])}</b></div>`).join('');

/* ---- sale ---- */
function done(){
  if(!cart.length)return toast('বিল খালি');
  const due=pay.method==='due';if(due&&!pay.cust.trim())return toast('বাকির বিলে কাস্টমারের নাম দিন');
  const sb=sub(),disc=Math.min(+pay.disc||0,sb),total=r2(sb-disc),t=Date.now();
  SEQ=(+LS.getItem('cs_seq')||0)+1;LS.setItem('cs_seq',SEQ);
  const s={k:ME.user+'-'+t.toString(36),no:ME.user.toUpperCase()+'-'+String(SEQ).padStart(4,'0'),t,at:t,name:ME.name,br:ME.br,
    items:cart.map(c=>({pid:c.pid,n:c.name,qty:c.qty*c.f,price:r2(c.price/c.f),un:c.un,uq:c.qty,f:c.f})),
    disc,method:pay.method,cust:pay.cust.trim(),phone:pay.phone.trim(),total};
  SL.unshift(s);Q.push(s);save();
  cart=[];pay={disc:0,method:'cash',cust:'',phone:''};
  render();rcpt(s.k);flush();
}
let SEQ=0;
async function flush(){
  if(busy||!ME||!Q.length)return;busy=true;
  try{
    while(Q.length){const s=Q[0];s.at=s.at||s.t;await dbPut('cashierSales/'+ME.uid+'/'+s.k,Object.assign({t:s.t,at:Date.now(),no:s.no,items:s.items,disc:s.disc,method:s.method,cust:s.cust,phone:s.phone,total:s.total,name:s.name,br:s.br},s.vk?{void:s.vk}:{},s.ret?{ret:s.ret}:{}));
      Q.shift();const x=SL.find(z=>z.k===s.k);if(x)x.sent=1;save();online=true}
  }catch(e){online=false;if(e.fatal)logout(true)}
  busy=false;hdr();if(tabN==='today')render();
}
function rcpt(k){
  const s=SL.find(x=>x.k===k);if(!s)return;const m={cash:'নগদ',bkash:'bKash',nagad:'Nagad',card:'কার্ড',due:'বাকি'};
  const h=`<div class="rcpt" id="rc"><div style="text-align:center"><b>${esc(CAT?CAT.shop:'')}</b>${CAT&&CAT.addr?'<br>'+esc(CAT.addr):''}${CAT&&CAT.vat?'<br>VAT: '+esc(CAT.vat):''}<br>বিল ${esc(s.no)}<br>${fdt(s.t)}<br>ক্যাশিয়ার: ${esc(s.name)}</div><hr>
  ${s.items.map(i=>`<div>${esc(i.n)}${i.un?' — '+bn(i.uq)+' '+esc(i.un)+' (×'+bn(i.f)+')':''}</div><div class="r"><span>${bn(i.qty)} × ${bn(r2(i.price))}</span><span>${bn(r2(i.qty*i.price))}</span></div>`).join('')}<hr>
  ${s.disc?`<div class="r"><span>ডিসকাউন্ট</span><span>-${bn(s.disc)}</span></div>`:''}<div class="r"><b>মোট</b><b>${tk(s.total)}</b></div><div class="r"><span>পেমেন্ট</span><span>${m[s.method]||s.method}</span></div>${s.cust?`<div class="r"><span>কাস্টমার</span><span>${esc(s.cust)}</span></div>`:''}<hr><div style="text-align:center">ধন্যবাদ! আবার আসবেন 😊</div></div>`;
  $('#modal').innerHTML=`<div class="mask" onclick="if(event.target===this)closeM()"><div class="sheet"><div style="background:#fff;padding:6px">${h}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="window.print()">🖨️ প্রিন্ট</button><button class="btn ok" onclick="shareR('${s.k}')">📤 শেয়ার</button></div><button class="btn g" style="margin-top:8px" onclick="closeM()">বন্ধ</button></div></div>`;
}
async function shareR(k){
  const s=SL.find(x=>x.k===k);if(!s)return;
  const t=(CAT?CAT.shop:'')+'\nবিল '+s.no+' · '+fdt(s.t)+'\n'+s.items.map(i=>i.n+(i.un?' — '+i.uq+' '+i.un:'')+'\n  '+i.qty+' × '+r2(i.price)+' = '+r2(i.qty*i.price)).join('\n')+(s.disc?'\nডিসকাউন্ট: -'+s.disc:'')+'\nমোট: ৳'+s.total+'\nধন্যবাদ!';
  try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);toast('কপি হয়েছে')}}catch(e){}
}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(t)));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function eye(id){const e=document.getElementById(id);if(e)e.type=e.type==='password'?'text':'password'}
function pinAsk(msg){return new Promise(res=>{
  window._pr=res;
  $('#modal2').innerHTML=`<div class="mask" style="z-index:70;align-items:center"><div class="sheet" style="border-radius:18px;width:92%"><b>🔐 ${esc(msg)}</b>
  <div class="row" style="margin-top:10px"><input class="inp" id="pinin" type="password" autocomplete="off" autocapitalize="none" onkeydown="if(event.key==='Enter')pinOk()"><button class="btn g fx" style="width:56px;padding:12px 0" onclick="eye('pinin')">👁</button></div>
  <div class="row" style="margin-top:10px"><button class="btn g" onclick="pinNo()">বাতিল</button><button class="btn ok" onclick="pinOk()">ঠিক আছে</button></div></div></div>`;
  setTimeout(()=>{const e=$('#pinin');if(e)e.focus()},50);
})}
function pinOk(){const v=$('#pinin').value;$('#modal2').innerHTML='';window._pr(v)}
function pinNo(){$('#modal2').innerHTML='';window._pr(null)}
let RV=null;
function voidAsk(k){
  const s=SL.find(x=>x.k===k);if(!s||s.void)return;
  if(!CAT||!CAT.pinH)return toast('মালিক ক্যানসেল পিন সেট করেননি');
  RV={k,r:s.items.map(()=>0)};voidUi();
}
function voidUi(){
  const s=SL.find(x=>x.k===RV.k);if(!s)return;
  const val=sum(s.items,(i,ix)=>RV.r[ix]*i.f*i.price);
  $('#modal').innerHTML=`<div class="mask" onclick="if(event.target===this){RV=null;closeM()}"><div class="sheet"><b>❌ ${esc(s.no)} — কোন পণ্য ফেরত / ক্যানসেল?</b>
  <div style="color:var(--mut);font-size:12px;margin:4px 0">যেটা ফেরত দেবে তার সংখ্যা + দিয়ে বাড়ান</div>
  ${s.items.map((i,ix)=>`<div class="ci"><div class="m"><b>${esc(i.n)}</b>${i.un?` <span class="pill">${esc(i.un)} ×${bn(i.f)}</span>`:''}<br><small>বিলে ${bn(i.uq)} · ${tk(i.f*i.price)} প্রতিটি</small></div><div class="q"><button onclick="rvq(${ix},-1)">−</button>${bn(RV.r[ix])}<button onclick="rvq(${ix},1)">+</button></div></div>`).join('')}
  <div class="tot b" style="margin-top:6px"><span>ফেরত</span><span>${tk(val)}</span></div>
  <div class="row" style="margin-top:8px"><button class="btn g" onclick="rvAll()">সব ক্যানসেল</button><button class="btn ok" onclick="rvGo()">✓ নিশ্চিত করুন</button></div>
  <button class="btn g" style="margin-top:8px" onclick="RV=null;closeM()">বন্ধ</button></div></div>`;
}
function rvq(ix,d){const s=SL.find(x=>x.k===RV.k),m=s.items[ix].uq;RV.r[ix]=Math.max(0,Math.min(m,RV.r[ix]+d));voidUi()}
function rvAll(){const s=SL.find(x=>x.k===RV.k);RV.r=s.items.map(i=>i.uq);voidUi()}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(t)));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rvGo(){
  const s=SL.find(x=>x.k===RV.k);if(!s)return;
  if(!RV.r.some(x=>x>0))return toast('কোন পণ্য ফেরত তা বেছে নিন');
  const v=await pinAsk('ম্যানেজার পিন দিন');if(v===null)return;
  if(await sha(v.trim())!==CAT.pinH)return toast('❌ ভুল পিন');
  const full=s.items.every((i,ix)=>RV.r[ix]>=i.uq),inQ=Q.findIndex(x=>x.k===s.k);
  if(full){
    s.void=1;
    if(inQ>=0)Q.splice(inQ,1);else Q.push({k:s.k+'-X',vk:s.k,no:s.no,t:Date.now(),at:Date.now(),name:s.name,br:s.br,items:s.items,disc:0,method:'void',cust:'',phone:'',total:s.total});
  }else{
    const ret=[];s.items.forEach((i,ix)=>{if(RV.r[ix]>0)ret.push({pid:i.pid,qty:RV.r[ix]*i.f})});
    const oldSub=sum(s.items,i=>i.qty*i.price);
    s.items.forEach((i,ix)=>{const r=RV.r[ix];i.uq-=r;i.qty-=r*i.f});
    s.items=s.items.filter(i=>i.qty>0);
    const ns=sum(s.items,i=>i.qty*i.price);s.disc=oldSub>0?r2(s.disc*ns/oldSub):0;s.total=r2(ns-s.disc);s.part=1;
    if(inQ<0)Q.push({k:s.k+'-R'+Date.now().toString(36),vk:s.k,ret,no:s.no,t:Date.now(),at:Date.now(),name:s.name,br:s.br,items:ret.map(r=>({pid:r.pid,qty:r.qty,price:0,n:''})),disc:0,method:'void',cust:'',phone:'',total:0});
  }
  RV=null;save();closeM();render();toast('✅ হয়েছে');flush();
}
const closeM=()=>{$('#modal').innerHTML=''};

/* ---- camera ---- */
let _stream=null,_on=false;
async function cam(){
  if(!('BarcodeDetector' in window))return toast('এই ব্রাউজারে ক্যামেরা স্ক্যান নেই (Chrome ব্যবহার করুন)');
  try{
    _stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    $('#modal').innerHTML=`<div class="mask" style="align-items:center"><div class="sheet" style="border-radius:18px;width:92%"><video id="cv" playsinline autoplay muted style="width:100%;border-radius:12px"></video><button class="btn g" style="margin-top:10px" onclick="stopCam()">বন্ধ করুন</button></div></div>`;
    const v=$('#cv');v.srcObject=_stream;await v.play();const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128']});_on=true;
    const loop=async()=>{if(!_on)return;try{const r=await det.detect(v);if(r.length){stopCam();add(r[0].rawValue);return}}catch(e){}setTimeout(loop,250)};loop();
  }catch(e){toast('ক্যামেরা চালু হয়নি')}
}
function stopCam(){_on=false;if(_stream)_stream.getTracks().forEach(t=>t.stop());_stream=null;closeM()}

/* ---- views ---- */
function hdr(){const h=$('#hd');if(h)h.innerHTML=hdHtml()}
const hdHtml=()=>`<div style="flex:1"><b>${esc(ME.name)}</b><small>${esc(ME.br)}${Q.length?' · ⏳ '+bn(Q.length)+'টি পাঠানো বাকি':''}</small></div><span class="dot ${online?'':'off'}"></span><small>${online?'অনলাইন':'অফলাইন'}</small>`;
function vSell(){
  const sb=sub(),disc=Math.min(+pay.disc||0,sb);
  const ms=[['cash','নগদ'],['bkash','bKash'],['nagad','Nagad'],['card','কার্ড'],['due','বাকি']];
  return `<div class="card"><div class="row"><input class="inp" id="scan" enterkeyhint="go" autocomplete="off" placeholder="বারকোড স্ক্যান / নম্বর" onkeydown="scanKey(event)"><button class="btn ok fx" style="width:56px;padding:14px 0" onclick="scanBtn()">＋</button><button class="btn g fx" style="width:56px;padding:14px 0" onclick="cam()">📷</button></div>
  <input class="inp" style="margin-top:8px" placeholder="🔍 নাম দিয়ে খুঁজুন" value="${esc(srch)}" oninput="srchIn(this.value)"><div class="res" id="sr" style="${srch?'':'display:none'}">${srHtml()}</div></div>
  <div class="card">${cart.length?cart.map((c,i)=>`<div class="ci"><div class="m"><b>${esc(c.name)}</b>${c.un?` <span class="pill">${esc(c.un)} ×${bn(c.f)}</span>`:''}<br><input class="inp" type="number" inputmode="decimal" style="width:90px;padding:6px;margin-top:4px" value="${c.price}" onchange="price(${i},this.value)"></div><div class="q"><button onclick="qty(${i},-1)">−</button>${bn(c.qty)}<button onclick="qty(${i},1)">+</button></div></div>`).join(''):'<div style="text-align:center;color:var(--mut);padding:20px">বিল খালি — বারকোড স্ক্যান করুন</div>'}</div>
  <div class="card"><div class="row"><div><label style="margin-top:0">ডিসকাউন্ট (৳)</label><input class="inp" type="number" inputmode="decimal" value="${pay.disc||''}" onchange="pay.disc=+this.value||0;render()"></div><div><label style="margin-top:0">পেমেন্ট</label><select onchange="pay.method=this.value;render()">${ms.map(m=>`<option value="${m[0]}" ${pay.method===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select></div></div>
  <div class="row"><div><label>কাস্টমার${pay.method==='due'?' *':' (ঐচ্ছিক)'}</label><input class="inp" value="${esc(pay.cust)}" onchange="pay.cust=this.value"></div><div><label>ফোন</label><input class="inp" inputmode="tel" value="${esc(pay.phone)}" onchange="pay.phone=this.value"></div></div>
  <div class="tot" style="margin-top:8px"><span>সাবটোটাল</span><span>${tk(sb)}</span></div><div class="tot b"><span>মোট</span><span>${tk(sb-disc)}</span></div>
  <button class="btn ok" style="margin-top:8px" onclick="done()">✓ বিক্রি সম্পন্ন</button>${cart.length?`<button class="btn g" style="margin-top:8px" onclick="cart=[];render()">বিল বাতিল</button>`:''}</div>`;
}
function vToday(){
  const d0=sod(Date.now()),T=SL.filter(s=>s.t>=d0&&!s.void),V=SL.filter(s=>s.t>=d0&&s.void),m={cash:'নগদ',bkash:'bKash',nagad:'Nagad',card:'কার্ড',due:'বাকি'};
  const by={};T.forEach(s=>by[s.method]=r2((by[s.method]||0)+s.total));
  return `<div class="card"><div class="tot b"><span>আজকের বিক্রি</span><span>${tk(sum(T,s=>s.total))}</span></div><div class="tot"><span>বিল</span><span>${bn(T.length)}টি</span></div>
  ${Object.keys(by).map(k=>`<div class="tot"><span>${m[k]||k}</span><span>${tk(by[k])}</span></div>`).join('')}</div>
  <div class="card">${T.map(s=>`<div class="ci"><div class="m"><b>${esc(s.no)}</b> <small>${fdt(s.t)}</small><br><small>${s.sent?'✅ পাঠানো হয়েছে':'⏳ পাঠানো বাকি'} · ${m[s.method]||s.method}</small></div><b>${tk(s.total)}</b><button class="btn g sm" onclick="rcpt('${s.k}')">🖨️</button><button class="btn g sm" style="color:var(--bad)" onclick="voidAsk('${s.k}')">❌</button></div>`).join('')||'<div style="text-align:center;color:var(--mut);padding:16px">আজ এখনো বিক্রি নেই</div>'}
  ${V.length?`<div style="margin-top:8px;color:var(--mut)">❌ ক্যানসেল: ${V.map(s=>esc(s.no)+' ('+tk(s.total)+')').join(', ')}</div>`:''}
  ${Q.length?`<button class="btn" style="margin-top:8px" onclick="flush()">🔄 এখনই পাঠান</button>`:''}</div>
  <button class="btn g" onclick="if(confirm('লগআউট করবেন?'))logout()">🚪 লগআউট</button>`;
}
function vLogin(){return `<div class="login card"><h2>🧑‍💼 ক্যাশিয়ার লগইন</h2><label>আইডি</label><input class="inp" id="lu" autocapitalize="none" autocomplete="username"><label>পাসওয়ার্ড</label><div class="row"><input class="inp" id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn g fx" style="width:56px;padding:12px 0" onclick="eye('lp')">👁</button></div><button class="btn" style="margin-top:14px" onclick="login()">লগইন</button>${CLOUD.dbUrl?'':'<p style="color:var(--bad)">cloud.json পাওয়া যায়নি</p>'}</div>`}
function render(){
  const a=$('#app');
  if(!ME){a.innerHTML=vLogin();return}
  if(!CAT){a.innerHTML=`<header id="hd">${hdHtml()}</header><main><div class="card" style="text-align:center">প্রোডাক্ট তালিকা লোড হচ্ছে...<br><small style="color:var(--mut)">ইন্টারনেট লাগবে (প্রথমবার)। অ্যাডমিন অ্যাপ একবার খুলে সিঙ্ক করা থাকতে হবে।</small></div></main>`;return}
  const f=document.activeElement&&document.activeElement.id==='scan';
  a.innerHTML=`<header id="hd">${hdHtml()}</header><main>${tabN==='sell'?vSell():vToday()}</main><nav><button class="${tabN==='sell'?'on':''}" onclick="tabN='sell';render()">🛒 বিক্রি</button><button class="${tabN==='today'?'on':''}" onclick="tabN='today';render()">📋 আজকের বিল</button></nav>`;
  if(tabN==='sell'){const s=$('#scan');if(s&&(f||!srch))s.focus()}
}
async function login(){
  const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value;if(!u||!p)return toast('আইডি ও পাসওয়ার্ড দিন');
  if(!CLOUD.apiKey)return toast('cloud.json নেই');
  try{
    const uid=await signIn(u,p),me=await dbGet('cashiers/'+uid);
    if(!me||me.active===false)return toast('এই অ্যাকাউন্ট চালু নেই — মালিকের সাথে কথা বলুন');
    ME={uid,user:u,name:me.name,br:me.br};jset('cs_me',ME);render();loadCat();
  }catch(e){toast(/INVALID|EMAIL_NOT_FOUND|PASSWORD/.test(e.message)?'❌ আইডি বা পাসওয়ার্ড ভুল':'❌ '+(online?e.message:'ইন্টারনেট নেই'))}
}
function logout(force){
  if(!force&&Q.length&&!confirm('⚠️ '+bn(Q.length)+'টি বিল এখনো পাঠানো হয়নি — লগআউট করলে হারিয়ে যেতে পারে। তবুও?'))return;
  LS.removeItem('cs_me');LS.removeItem('cs_rt');AUTH.tok='';AUTH.rt='';ME=null;cart=[];render();
}
window.addEventListener('online',()=>{online=true;hdr();flush();loadCat()});window.addEventListener('offline',()=>{online=false;hdr()});
render();if(ME){loadCat();flush()}
setInterval(()=>{if(ME){flush();if(!Q.length)loadCat()}},30000);
</script></body></html>
