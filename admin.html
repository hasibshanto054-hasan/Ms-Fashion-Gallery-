<style>
:root{--bg:#120622;--bg2:#1a0a2e;--card:#241042;--card2:#2e1654;--tx:#f5eefc;--mut:#b9a6d6;--pri:#a855f7;--pri2:#ec4899;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--bd:rgba(255,255,255,.1)}
body.light{--bg:#faf5ff;--bg2:#fff;--card:#fff;--card2:#f3e8ff;--tx:#1f1033;--mut:#6b5b86;--bd:rgba(0,0,0,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif}
body{padding-bottom:80px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:560px;margin:auto;padding:0 14px}
.wrap.wide{max-width:960px}
header{position:sticky;top:0;z-index:20;background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:10px}
header .logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
header .hi{font-size:12px;color:var(--mut)}
header .sp{flex:1}
.ib{background:var(--card);border-radius:12px;padding:8px 11px;font-size:16px;position:relative}
.badge{position:absolute;top:-5px;right:-5px;background:var(--pri2);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;min-width:16px;text-align:center}

.cd span{background:rgba(0,0,0,.25);border-radius:8px;padding:4px 8px;font-size:13px;text-align:center;min-width:46px}

.chip{white-space:nowrap;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:7px 14px;font-size:13px;color:var(--tx)}

.row{display:flex;gap:8px;align-items:center}

select,.inp{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);outline:0}

.mnu{display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px}

<header>

<script>
/* ===== MS Fashion — shared core (used by index.html and admin.html) ===== */
function _store(name){let real=null;try{real=window[name];real.getItem('__t')}catch(e){real=null}const m={};return{getItem:k=>{if(real){try{return real.getItem(k)}catch(e){}}return k in m?m[k]:null},setItem:(k,v)=>{m[k]=String(v);if(real){try{real.setItem(k,v)}catch(e){}}},removeItem:k=>{delete m[k];if(real){try{real.removeItem(k)}catch(e){}}}}}
const LS=_store('localStorage'),SS=_store('sessionStorage');
const $=s=>document.querySelector(s);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const tk=n=>'৳'+bn(Math.round(n).toLocaleString('en-US'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const STATUS=['পেন্ডিং','কনফার্মড','শিপড','ডেলিভারড','ক্যানসেলড'];
const OFN={weekly:'সাপ্তাহিক',monthly:'মাসিক'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function closeM(){const m=$('#modal');if(m)m.innerHTML=''}

/* ----- theme ----- */
function applyTheme(){
  const l=LS.getItem('msf_theme')==='light';
  document.body.classList.toggle('light',l);
  const b=$('#thb');if(b)b.textContent=l?'☀️':'🌙';
}
function toggleTheme(){try{LS.setItem('msf_theme',LS.getItem('msf_theme')==='light'?'dark':'light')}catch(e){}applyTheme()}

/* ----- EAN-13 barcode ----- */
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return (10-s%10)%10}
function eanFromSeq(n){const b='200'+String(n).padStart(9,'0');return b+eanCheck(b)}
function eanValid(c){return /^\d{13}$/.test(String(c))&&+c[12]===eanCheck(String(c).slice(0,12))}
const _L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const _G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const _R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const _P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function barcodeSVG(code,h){
  h=h||56;code=String(code);
  if(!eanValid(code))return `<div class="bc" style="font:12px monospace;color:#000;padding:8px">${esc(code)}</div>`;
  const d=code.split('').map(Number);
  let bits='101';
  for(let i=0;i<6;i++)bits+=(_P[d[0]][i]==='L'?_L:_G)[d[i+1]];
  bits+='01010';
  for(let i=7;i<13;i++)bits+=_R[d[i]];
  bits+='101';
  const m=2,q=10;let rects='',i=0;
  while(i<bits.length){
    if(bits[i]==='1'){let j=i;while(bits[j]==='1')j++;rects+=`<rect x="${(q+i)*m}" y="0" width="${(j-i)*m}" height="${h}"/>`;i=j}else i++;
  }
  const W=(95+q*2)*m;
  const t=(s,x)=>`<text x="${x}" y="${h+12}" text-anchor="middle" font-size="11" font-family="monospace" fill="#000">${s}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h+16}" style="width:100%;max-width:210px;background:#fff;border-radius:4px"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g>${t(code[0],(q-4)*m)}${t(code.slice(1,7),(q+24)*m)}${t(code.slice(7),(q+71)*m)}</svg>`;
}

/* ----- offers (call after setting OFFERS) ----- */
let OFFERS={};
function bestOffer(p){
  return ['weekly','monthly'].map(k=>({k,...(OFFERS[k]||{})}))
    .filter(o=>o.on&&o.end>Date.now()&&(!o.ids||!o.ids.length||o.ids.includes(p.id)))
    .sort((a,b)=>b.pct-a.pct)[0]||null;
}
function eff(p){const o=bestOffer(p);return o?Math.round(p.price*(1-o.pct/100)):p.price}
function discPct(p){const b=Math.max(p.old||0,p.price),e=eff(p);return b>e?Math.round((1-e/b)*100):0}
function priceHTML(p){
  const b=Math.max(p.old||0,p.price),e=eff(p),o=bestOffer(p);
  return tk(e)+(b>e?`<s>${tk(b)}</s>`:'')+(o?`<div style="font-size:11px;color:var(--ok);font-weight:600">🎁 ${OFN[o.k]} অফার -${bn(o.pct)}%</div>`:'');
}

   ['চিনো প্যান্ট','👖',1300,1600,'প্যান্ট',['২৮','৩০','৩২','৩৪','৩৬'],'অফিস ও ক্যাজুয়াল দুই কাজেই।'],

/* ===== CLOUD (Firebase Realtime Database — REST) =====
   ⬇️ Firebase প্রজেক্ট খোলার পর শুধু এই লাইনে দুটি মান বসান (কাস্টমার ও অ্যাডমিন দুই অ্যাপেই একই মান) */
const CLOUD={apiKey:'',dbUrl:''};
try{if(!CLOUD.dbUrl){const x=new XMLHttpRequest();x.open('GET','cloud.json?'+Date.now(),false);x.send();if(x.status==200){const j=JSON.parse(x.responseText);if(j.apiKey)CLOUD.apiKey=j.apiKey;if(j.dbUrl)CLOUD.dbUrl=j.dbUrl}}}catch(e){}
const cloudOn=()=>!!(CLOUD.apiKey&&CLOUD.dbUrl);
const dbu=(path,tok,q)=>{const a=[];if(q)a.push(q);if(tok)a.push('auth='+encodeURIComponent(tok));return String(CLOUD.dbUrl).replace(/\/+$/,'')+'/'+path+'.json'+(a.length?'?'+a.join('&'):'')};
async function dbGet(path,tok,q){const r=await fetch(dbu(path,tok,q),{cache:'no-store'});if(!r.ok)throw new Error('GET '+path+' '+r.status);return r.json()}
async function dbPut(path,val,tok){const r=await fetch(dbu(path,tok),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});if(!r.ok)throw new Error('PUT '+path+' '+r.status);return r.json()}

async function fbSignIn(email,pw){
  const base=CLOUD.authBase||'https://identitytoolkit.googleapis.com';
  const r=await fetch(base+'/v1/accounts:signInWithPassword?key='+encodeURIComponent(CLOUD.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});
  const j=await r.json();
  if(!r.ok)throw new Error((j.error&&j.error.message)||'login failed');
  AUTH.tok=j.idToken;AUTH.exp=Date.now()+(Math.max(60,+j.expiresIn||3600)-60)*1000;AUTH.rt=j.refreshToken;AUTH.email=email;
  LS.setItem('msf_rt',AUTH.rt);LS.setItem('msf_em',email);
}
async function authTok(){
  if(AUTH.tok&&Date.now()<AUTH.exp)return AUTH.tok;
  if(!AUTH.rt)throw new Error('session expired');
  const base=CLOUD.tokBase||'https://securetoken.googleapis.com';
  const r=await fetch(base+'/v1/token?key='+encodeURIComponent(CLOUD.apiKey),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AUTH.rt)});
  const j=await r.json();
  if(!r.ok)throw new Error('session expired');
  AUTH.tok=j.id_token;AUTH.exp=Date.now()+(Math.max(60,+j.expires_in||3600)-60)*1000;AUTH.rt=j.refresh_token||AUTH.rt;LS.setItem('msf_rt',AUTH.rt);
  return AUTH.tok;
}

/* ---- PDF engine (no library, works offline): lay out HTML in a hidden iframe, paint words/borders to canvas, write JPEG pages into a PDF ---- */
async function pdfRender(html){
  const fr=document.createElement('iframe');
  fr.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1200px;border:0;visibility:hidden';
  document.body.appendChild(fr);
  try{
    const d=fr.contentDocument;d.open();
    d.write('<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#fff;color:#000;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;font-size:12px}table{border-collapse:collapse}h2,h3{margin:0}hr{border:0;border-top:1px solid #000;margin:8px 0}</style><body><div id="r" style="width:794px;box-sizing:border-box">'+html+'</div></body>');d.close();
    await new Promise(r=>setTimeout(r,250));
    const W=794,S=2,PW=595.28,PHt=841.89,PH=1123,M=22,CH=PH-2*M,root=d.getElementById('r'),H=Math.ceil(root.getBoundingClientRect().height),ops=[],cand=[];
    const col=c=>{const m=/rgba?\(([^)]+)\)/.exec(c);if(!m)return null;const v=m[1].split(',').map(Number);return v.length>3&&v[3]===0?null:c};
    const walk=n=>{
      if(n.nodeType===3){
        const cs=getComputedStyle(n.parentNode),t=n.data;let m;const re=/\S+/g,font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
        let c=cs.color;const q=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c);if(q&&+q[1]>200&&+q[2]>200&&+q[3]>200)c='#000';
        while((m=re.exec(t))){const rg=d.createRange();rg.setStart(n,m.index);rg.setEnd(n,m.index+m[0].length);const r=rg.getBoundingClientRect();if(r.width>0)ops.push({k:'t',s:m[0],x:r.left,y:r.top,h:r.height,font,c})}
        return}
      if(n.nodeType!==1)return;
      const cs=getComputedStyle(n);if(cs.display==='none')return;
      const r=n.getBoundingClientRect();
      if(n.tagName==='TR'||n.parentNode===root)cand.push(r.bottom);
      const bg=col(cs.backgroundColor);if(bg&&r.width>0&&r.height>0)ops.push({k:'r',x:r.left,y:r.top,w:r.width,h:r.height,c:bg});
      [['Top',0],['Bottom',1],['Left',2],['Right',3]].forEach(([s,i])=>{const w=parseFloat(cs['border'+s+'Width']);if(w>0&&cs['border'+s+'Style']!=='none'&&r.width>0){const c=col(cs['border'+s+'Color'])||'#000';
        if(i===0)ops.push({k:'r',x:r.left,y:r.top,w:r.width,h:w,c});else if(i===1)ops.push({k:'r',x:r.left,y:r.bottom-w,w:r.width,h:w,c});else if(i===2)ops.push({k:'r',x:r.left,y:r.top,w:w,h:r.height,c});else ops.push({k:'r',x:r.right-w,y:r.top,w:w,h:r.height,c})}});
      n.childNodes.forEach(walk);
    };
    root.childNodes.forEach(walk);
    cand.sort((a,b)=>a-b);
    const cuts=[0];let y0=0;
    while(y0<H-1){const tg=y0+CH;if(tg>=H){cuts.push(H);break}
      let e=tg;for(const c of cand)if(c<=tg&&c>y0+CH*0.5)e=c;
      cuts.push(e);y0=e}
    const pages=[];
    for(let i=0;i<cuts.length-1;i++){
      const a=cuts[i],b=cuts[i+1],cv=document.createElement('canvas');cv.width=W*S;cv.height=PH*S;
      const x=cv.getContext('2d');x.scale(S,S);x.fillStyle='#fff';x.fillRect(0,0,W,PH);
      x.save();x.beginPath();x.rect(0,M,W,b-a+1);x.clip();x.translate(0,M-a);x.textBaseline='middle';
      for(const o of ops){
        if(o.k==='r'){if(o.y+o.h<a||o.y>b)continue;x.fillStyle=o.c;x.fillRect(o.x,o.y,o.w,o.h)}
        else{if(o.y+o.h<a||o.y>b)continue;x.font=o.font;x.fillStyle=o.c;x.fillText(o.s,o.x,o.y+o.h/2)}
      }
      x.restore();
      const bl=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));
      pages.push(new Uint8Array(await bl.arrayBuffer()));cv.width=cv.height=1;
    }
    return pdfWrite(pages,W*S,PH*S,PW,PHt);
  }finally{fr.remove()}
}
function pdfWrite(jp,w,h,PW,PHt){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=u=>{if(typeof u==='string')u=enc.encode(u);parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;add(n+' 0 obj\n');add(body);add('\nendobj\n')};
  const np=jp.length;add('%PDF-1.4\n');
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');
  obj(2,'<</Type/Pages/Count '+np+'/Kids['+jp.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
  jp.forEach((b,i)=>{
    const pg=3+3*i,ct=pg+1,im=pg+2,cs='q '+PW+' 0 0 '+PHt+' 0 0 cm /Im0 Do Q';
    obj(pg,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+PW+' '+PHt+']/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+ct+' 0 R>>');
    obj(ct,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
    offs[im]=len;add(im+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+b.length+'>>\nstream\n');add(b);add('\nendstream\nendobj\n');
  });
  const n=3+3*np,xr=len;let x='xref\n0 '+n+'\n0000000000 65535 f \n';
  for(let i=1;i<n;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  add(x+'trailer\n<</Size '+n+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}
async function pdfMake(){

/* ----- fiscal year ----- */
function fyRange(y){const m=D.cfg.fyStart-1;return[new Date(y,m,1).getTime(),new Date(y+1,m,1).getTime()]}
function fyOfDate(t){const d=new Date(t),m=D.cfg.fyStart-1;return d.getMonth()>=m?d.getFullYear():d.getFullYear()-1}
const fyLabel=y=>D.cfg.fyStart===1?bn(y):bn(y)+'-'+bn(y+1);
const fyStartOf=t=>fyRange(fyOfDate(t))[0];

/* ----- period selector (shared by all reports) ----- */
let rg='fy',cf='',ct='';
function range(){
  const n=new Date();let f=0,t=Date.now()+1;
  if(rg==='fy')return fyRange(D.cfg.fy);
  if(rg==='today')f=sod(Date.now());
  else if(rg==='7')f=sod(Date.now())-6*DAY;
  else if(rg==='30')f=sod(Date.now())-29*DAY;
  else if(rg==='month')f=new Date(n.getFullYear(),n.getMonth(),1).getTime();
  else if(rg==='custom'){f=cf?new Date(cf+'T00:00:00').getTime():0;t=ct?new Date(ct+'T00:00:00').getTime()+DAY:t}
  return[f,t];
}
const PR=[['fy','অর্থ বছর'],['today','আজ'],['7','৭ দিন'],['30','৩০ দিন'],['month','এই মাস'],['all','সব'],['custom','তারিখ বাছুন']];
function perBar(){
  return `<div class="chips">${PR.map(r=>`<button class="chip ${rg===r[0]?'on':''}" onclick="rg='${r[0]}';render()">${r[1]}${r[0]==='fy'?' ('+fyLabel(D.cfg.fy)+')':''}</button>`).join('')}</div>${rg==='custom'?`<div class="row"><input class="inp" type="date" value="${cf}" onchange="cf=this.value;render()"><input class="inp" type="date" value="${ct}" onchange="ct=this.value;render()"></div>`:''}`;
}

/* ----- journal ----- */
function jPost(src,ref,desc,lines,o){
  o=o||{};
  lines=lines.map(l=>{const o={a:l.a,d:r2(l.d||0),c:r2(l.c||0)};if(l.ld)o.ld=l.ld;if(l.doc)o.doc=l.doc;if(l.rep)o.rep=l.rep;if(l.m)o.m=l.m;return o}).filter(l=>l.d||l.c);
  const dr=r2(sum(lines,l=>l.d)),cr=r2(sum(lines,l=>l.c));
  if(Math.abs(dr-cr)>=0.011)throw new Error('এন্ট্রি মিলছে না: ডেবিট '+dr+' ≠ ক্রেডিট '+cr);
  D.jseq=(D.jseq||0)+1;
  const e={id:D.jseq,no:'J'+pad(D.jseq),t:o.t||Date.now(),src,ref:ref||'',desc,cc:o.cc||'',lines,posted:o.posted!==undefined?o.posted:D.cfg.autoPost};
  D.journal.push(e);return e;
}
function accOfMethod(m){m=String(m||'');if(m==='due')return AC().ar;if(m==='cash'||m==='cod'||m.indexOf('cash')===0)return AC().cash;return AC().mob}
function acctBal(code){let b=0;D.journal.forEach(e=>{if(e.posted)e.lines.forEach(l=>{if(l.a===code)b+=l.d-l.c})});return r2(b)}

/* ----- sales ----- */
function buildSale(items,disc,fee,method,extra){
  const rows=items.map(i=>{const p=P(i.pid)||{},cl=taxOf(p.tax);return{pid:i.pid,name:p.name||i.name||'?',code:p.code||'',qty:+i.qty,price:+i.price,cost:i.cost!==undefined?+i.cost:(p.cost||0),tax:cl.k,rate:cl.rate,cat:p.cat||'অন্যান্য',sub:p.sub||''}});
  const sub=r2(sum(rows,r=>r.qty*r.price));disc=Math.min(r2(disc||0),sub);fee=r2(fee||0);
  let rem=disc;
  rows.forEach((r,i)=>{const g=r.qty*r.price,sh=i===rows.length-1?rem:r2(sub?disc*g/sub:0);rem=r2(rem-sh);r.lt=r2(g-sh);r.vat=r.rate>0?r2(r.lt*r.rate/(100+r.rate)):0;r.net=r2(r.lt-r.vat)});
  return Object.assign({items:rows,sub,disc,fee,vat:r2(sum(rows,r=>r.vat)),net:r2(sum(rows,r=>r.net)),total:r2(sum(rows,r=>r.lt)+fee),method},extra||{});
}
function postSale(s,o){
  const a=AC(),cogs=r2(sum(s.items,i=>i.qty*i.cost));
  o=Object.assign({t:s.t,cc:s.src==='online'?'অনলাইন':'মূল দোকান'},o||{});
  const e=jPost('sale',s.id,'বিক্রয় বিল #'+s.id+(s.cust?' – '+s.cust:''),[
    {a:accOfMethod(s.method),d:s.total},{a:a.sales,c:r2(s.total-s.vat-s.fee)},{a:a.vout,c:s.vat},{a:a.deliv,c:s.fee},{a:a.cogs,d:cogs},{a:a.inv,c:cogs}],o);
  s.jid=e.id;return e;
}
function addSupplier(name){name=String(name||'').trim();if(!name)return '';if(!D.suppliers.some(s=>s.name===name))D.suppliers.push({id:Date.now(),name,phone:''});return name}
function supBal(name){
  return r2(sum(D.purchases.filter(p=>p.supplier===name),p=>pout(p))+sum(D.notes.filter(n=>n.supplier===name&&!n.ref&&n.kind==='credit'),n=>n.total)-sum(D.notes.filter(n=>n.supplier===name&&!n.ref&&n.kind==='debit'),n=>n.total));
}

/* ----- migration (runs on every load, heavy part only once) ----- */
function migrate(){
  const d=D;
  const dc={fyStart:7,fy:0,autoPost:true,defTax:'std',cc:['মূল দোকান','অনলাইন','গুদাম'],acc:{cash:'1010',mob:'1020',ar:'1100',inv:'1200',vin:'1300',ap:'2010',vout:'2100',cap:'3000',sales:'4000',deliv:'4100',cogs:'5000'}};
  const oa=(d.cfg&&d.cfg.acc)||{};
  d.cfg=Object.assign({},dc,d.cfg||{});d.cfg.acc=Object.assign({},dc.acc,oa);
  if(!d.cfg.fy)d.cfg.fy=fyOfDate(Date.now());
  d.tax=d.tax||[{k:'std',name:'স্ট্যান্ডার্ড হার',rate:15},{k:'zero',name:'শূন্য হার',rate:0},{k:'exempt',name:'অব্যাহতিপ্রাপ্ত',rate:0}];
  d.accounts=d.accounts||[];
  ACC_DEF.forEach(a=>{if(!d.accounts.some(x=>x.code===a[0]))d.accounts.push({code:a[0],name:a[1],type:a[2]})});
  ['journal','suppliers','purchases','notes'].forEach(k=>{d[k]=d[k]||[]});
  d.set=d.set||{};if(d.set.vat===undefined)d.set.vat='98765432198765';
  d.purchases.forEach(x=>{if(typeof x.vat==='string'){x.vno=x.vat;x.vat=r2((x.items||[]).reduce((a,i)=>a+(+i.vat||0),0))}});
  d.jseq=d.jseq||0;d.pseq=d.pseq||0;
  d.st=Object.assign({seq:{},closed:[],docs:[],xf:[],po:[],cats:[],bprice:{},plog:[],reps:[],targets:{},eod:[],open:{status:'draft',lines:{}},sheets:[]},d.st||{});
  d.nseq=Object.assign({dn:0,cn:0},d.nseq||{});d.vseq=Object.assign({rv:0,pv:0,rrv:0,rpv:0},d.vseq||{});
  d.products.forEach(p=>{if(!p.tax)p.tax=d.cfg.defTax;if(p.sub===undefined)p.sub=SUBMAP[p.name]||''});
  if(d.migrated)return;
  d.migrated=1;
  const T0=Math.min(Date.now(),...d.sales.map(s=>s.t),...(d.expenses||[]).map(e=>e.t),...(d.returns||[]).map(e=>e.t),...(d.damages||[]).map(e=>e.t))-1000;
  d.sales.forEach(s=>{
    if(s.jid)return;
    const nd=buildSale(s.items.map(i=>({pid:i.pid,name:i.name,qty:i.qty,price:i.price,cost:i.cost})),s.disc||0,s.fee||0,s.method);
    s.items=nd.items;s.sub=nd.sub;s.disc=nd.disc;s.fee=nd.fee;s.vat=nd.vat;s.net=nd.net;s.total=nd.total;
    s.paidAmt=s.paidAt?s.total:0;
    postSale(s,{t:s.t,posted:true});
  });
  (d.expenses||[]).forEach(e=>{const a=d.accounts.find(x=>x.name===e.cat&&x.type==='expense');jPost('exp','','খরচ: '+e.cat+(e.note?' – '+e.note:''),[{a:a?a.code:'5190',d:e.amt},{a:AC().cash,c:e.amt}],{t:e.t,posted:true})});
  (d.returns||[]).forEach(r=>{const l=[{a:AC().sales,d:r.refund},{a:AC().cash,c:r.refund}];if(r.restock){const v=r2(r.qty*(r.cost||0));l.push({a:AC().inv,d:v},{a:AC().cogs,c:v})}jPost('ret','','কাস্টমার ফেরত: '+r.name+' ×'+r.qty,l,{t:r.t,posted:true})});
  (d.damages||[]).forEach(x=>{const v=r2(x.qty*(x.cost||0));jPost('dmg','','ড্যামেজ: '+x.name+' ×'+x.qty,x.kind==='loss'?[{a:'5200',d:v},{a:AC().inv,c:v}]:[{a:AC().ap,d:v},{a:AC().inv,c:v}],{t:x.t,posted:true})});
  d.expenses=[];d.returns=[];d.damages=[];
  const sv_=r2(sum(d.products,p=>(p.stock||0)*(p.cost||0))),df=r2(sv_-acctBal(AC().inv));
  if(Math.abs(df)>=0.01)jPost('opening','OB','ওপেনিং স্টক (স্টকের মূল্য অনুযায়ী)',df>0?[{a:AC().inv,d:df},{a:AC().cap,c:df}]:[{a:AC().cap,d:-df},{a:AC().inv,c:-df}],{t:Math.min(T0,fyRange(d.cfg.fy)[0]+3600e3),posted:true});
}

/* ----- balances & P&L ----- */
function balRows(f,t){
  const post=D.journal.filter(e=>e.posted);
  return D.accounts.map(a=>{
    const pl=a.type==='income'||a.type==='expense',from=pl?fyStartOf(f):0;
    let bf=0,dr=0,cr=0;
    post.forEach(e=>e.lines.forEach(l=>{if(l.a!==a.code)return;if(e.t>=from&&e.t<f)bf+=l.d-l.c;else if(e.t>=f&&e.t<t){dr+=l.d;cr+=l.c}}));
    return{a,bf:r2(bf),dr:r2(dr),cr:r2(cr),cl:r2(bf+dr-cr)};
  });
}
function pnl(f,t){
  let sales=0,cogs=0,oi=0,ex=0;
  balRows(f,t).forEach(r=>{const a=r.a,mv=r.dr-r.cr;
    if(a.type==='income'){const v=-mv;if(a.code===AC().sales||a.code===AC().deliv)sales+=v;else oi+=v}
    else if(a.type==='expense'){if(a.code===AC().cogs)cogs+=mv;else ex+=mv}});
  sales=r2(sales);cogs=r2(cogs);oi=r2(oi);ex=r2(ex);
  return{sales,cogs,oi,ex,gross:r2(sales-cogs),net:r2(sales-cogs+oi-ex)};
}
const salesIn=(f,t)=>D.sales.filter(s=>inR(s.t,f,t)&&isPosted(s));
const purIn=(f,t)=>pflat(D.purchases.filter(p=>inR(p.t,f,t)&&isPosted(p)));
const notesIn=(f,t,k)=>pflat(D.notes.filter(n=>inR(n.t,f,t)&&isPosted(n)&&(!k||n.kind===k))).map(n=>Object.assign(n,{kind:n.kind}));
function vatTotals(f,t){
  const o=sum(salesIn(f,t),s=>s.vat),i=sum(purIn(f,t),p=>p.vat)-sum(notesIn(f,t,'debit'),n=>n.vat)+sum(notesIn(f,t,'credit'),n=>n.vat);
  return{out:r2(o),inp:r2(i),net:r2(o-i)};
}

/* ----- generic report renderer (HTML + CSV + print) ----- */
let RP=[];
const cellH=c=>typeof c==='number'?tk(c):(c&&c.q!==undefined?bn(c.q):esc(c));
const cellT=c=>typeof c==='number'?c:(c&&c.q!==undefined?c.q:String(c));
function rpt(secs){
  RP=secs;
  const body=secs.map(s=>`<div class="card"><b>${esc(s.title)}</b>${s.note?`<br><small style="color:var(--mut)">${esc(s.note)}</small>`:''}<div class="tbl"><table><tr>${s.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${cellH(c)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${s.cols.length}">এই সময়ে কোনো তথ্য নেই</td></tr>`}${s.foot?`<tr style="font-weight:700">${s.foot.map(c=>`<td>${cellH(c)}</td>`).join('')}</tr>`:''}</table></div></div>`).join('');
  window._rph=body;
  return body+`<div class="row"><button class="btn sm g" onclick="csvRpt()">⬇️ CSV</button><button class="btn sm g" onclick="printRpt()">🖨️ প্রিন্ট</button></div>`;
}
function csvRpt(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"',f=c=>{const v=cellT(c);return typeof v==='number'?v:q(v)};
  let o='';
  RP.forEach(s=>{o+=q(s.title)+'\n'+s.cols.map(q).join(',')+'\n'+s.rows.map(r=>r.map(f).join(',')).join('\n')+'\n'+(s.foot?s.foot.map(f).join(',')+'\n':'')+'\n'});
  download('report.csv','﻿'+o,'text/csv');
}
function printRpt(){
  printArea('<div style="padding:8px;font-size:12px"><h3>'+shopH()+'</h3>'+String(window._rph||'').replace(/class="card"/g,'style="border:1px solid #999;padding:8px;margin:8px 0"').replace(/<table>/g,'<table border="1" cellpadding="4" style="border-collapse:collapse;width:100%">')+'</div>');
}

function posAdd(code){
  const p=find(code);if(!p)return toast('❌ প্রোডাক্ট পাওয়া যায়নি: '+code);

  const it=bill.find(b=>b.pid===p.id&&(b.f||1)===f&&b.price===price),q=(it?it.qty:0)+1;

let _stream=null,_scanOn=false;
async function camScan(cb){
  if(!('BarcodeDetector' in window))return toast('এই ব্রাউজারে ক্যামেরা স্ক্যান নেই (Chrome ব্যবহার করুন) — স্ক্যানার বা টাইপ করুন');
  try{
    _stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const lay=document.createElement('div');lay.id='camlayer';
    lay.innerHTML=`<div class="mask" style="align-items:center;z-index:80"><div class="sheet" style="border-radius:20px"><video id="cv" playsinline autoplay muted style="width:100%;border-radius:12px"></video><button class="btn g" style="margin-top:10px" onclick="stopCam()">বন্ধ করুন</button></div></div>`;
    document.body.appendChild(lay);
    const v=$('#cv');v.srcObject=_stream;await v.play();
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','code_128']});_scanOn=true;
    const loop=async()=>{
      if(!_scanOn)return;
      try{const r=await det.detect(v);if(r.length){const val=r[0].rawValue;stopCam();cb(val);return}}catch(e){}
      setTimeout(loop,250);
    };loop();
  }catch(e){toast('ক্যামেরা চালু করা যায়নি');stopCam()}
}
function stopCam(){_scanOn=false;if(_stream){_stream.getTracks().forEach(t=>t.stop());_stream=null}const l=$('#camlayer');if(l)l.remove()}

/* ===== Barcode Printing for an Item (ASE-style) — search, choose qty, print only what is missing ===== */
const C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function bcBits(code){
  code=String(code);
  if(eanValid(code)){
    const d=code.split('').map(Number);let b='101';
    for(let i=0;i<6;i++)b+=(_P[d[0]][i]==='L'?_L:_G)[d[i+1]];
    b+='01010';for(let i=7;i<13;i++)b+=_R[d[i]];
    return b+'101';
  }
  let v=[],ck;
  if(/^\d{4,}$/.test(code)&&code.length%2===0){v=[105];for(let i=0;i<code.length;i+=2)v.push(+code.slice(i,i+2))}
  else{v=[104];for(const c of code){const x=c.charCodeAt(0)-32;v.push(x>=0&&x<=94?x:0)}}
  ck=v[0];for(let i=1;i<v.length;i++)ck+=v[i]*i;v.push(ck%103,106);
  let b='',bar=1;
  v.forEach(x=>{for(const w of C128[x]){b+=(bar?'1':'0').repeat(+w);bar=1-bar}bar=1});
  return b;
}
function bcBars(code,hgt,m,fs){fs=fs||10;
  const bits=bcBits(code),q=10;let out='',i=0;
  const sp=n=>`<i style="display:inline-block;width:${n*m}px;height:1px"></i>`;
  out+=sp(q);
  while(i<bits.length){
    let j=i;while(j<bits.length&&bits[j]===bits[i])j++;
    out+=bits[i]==='1'?`<i style="display:inline-block;border-left:${(j-i)*m}px solid #000;height:${hgt}px"></i>`:sp(j-i);

function saveP(id){
  epRead();const E=EP,n=E.name.trim(),pr=+E.price;if(!n||!pr)return toast('Enter item name and selling price');
  let code=E.code;if(!code){D.seq++;code=eanFromSeq(D.seq)}
  const dup=D.products.find(x=>(x.code===code||(x.units||[]).some(u=>u.bc===code))&&x.id!==id);if(dup)return toast('This barcode already exists: '+dup.name);
  if(/^200\d{9}\d$/.test(code)){const s=+code.slice(3,12);if(s>D.seq)D.seq=s}
  const cost=+E.cost||0,rows=[];
  for(const [i,u] of E.units.entries()){
    if(!u.n&&!u.f&&!u.bc&&!u.pr)continue;const f=+u.f;
    if(!(f>0))return toast('Pack row '+(i+2)+': enter pcs');
    let bc=u.bc;if(!bc){D.seq++;bc=eanFromSeq(D.seq)}
    const d2=D.products.find(x=>x.id!==id&&(x.code===bc||(x.units||[]).some(y=>y.bc===bc)));if(d2)return toast('Barcode '+bc+' already used by '+d2.name);
    if(bc===code||rows.some(r=>r.bc===bc))return toast('Barcode '+bc+' is repeated');
    rows.push({n:u.n||packName(f),f,bc,ty:u.ty||'other',pr:+u.pr>0?+u.pr:r2(f*pr)});
  }
  const d={name:n,code,price:pr,cost,old:+E.old||pr,cat:E.cat||'অন্যান্য',emoji:E.emoji||'👗',min:+E.min||0,sizes:E.sizes.split(',').map(s=>s.trim()).filter(Boolean),colors:(E.colors||'').split(',').map(s=>s.trim()).filter(Boolean),imgs:(E.imgs||'').trim(),photos:E.photos,desc:E.desc.trim(),sub:E.sub,tax:E.tax,units:rows,wn:E.wn,wd:E.wd};
  if(id)Object.assign(P(id),d);
  else{const np={id:Date.now(),stock:0,reviews:[],...d};D.products.push(np);const s0=+E.s0||0;if(s0>0){stockMove(np.id,s0,'in','ওপেনিং স্টক',np.cost);if(np.cost>0)jPost('stockopen','','ওপেনিং স্টক: '+np.name+' ×'+s0,[{a:AC().inv,d:r2(s0*np.cost)},{a:AC().cap,c:r2(s0*np.cost)}],{cc:'গুদাম'})}}
  sv();closeM();toast('✅ Saved');if(tab==='stock'&&PRC){const np=D.products[D.products.length-1],i=PR.lines.findIndex(l=>!l.pid);if(i>=0)prFill(i,np,null)}render();
}
function delP(id){if(confirm('প্রোডাক্ট মুছে ফেলবেন? (আগের বিক্রির হিসাব থাকবে)')){D.products=D.products.filter(p=>p.id!==id);sv();render()}}

  (D.orders.length?D.orders.map(o=>`<div class="card"><b>#${esc(o.id)}</b> · ${tk(o.total)} <span class="pill">${esc(o.pay)}</span><br><small style="color:var(--mut)">${fdt(o.date)}</small>

  ${needPay(o)?`<div style="background:#fff3cd;color:#000;border:1px solid #e0b800;border-radius:10px;padding:8px;margin:6px 0"><b>💰 Payment awaiting your check</b><br><small>${esc(o.pay)} · Amount <b>${tk(o.total)}</b> · TrxID <b>${esc(o.txn||'—')}</b><br>Check the money arrived in your ${esc(o.pay)} account, then press OK. The order is <b>not confirmed</b> until you do.</small>
  <div class="row" style="margin-top:6px"><button class="btn sm ok" onclick="payOk('${o.id}')">✅ Payment received — OK (confirm)</button><button class="btn sm red" onclick="payNo('${o.id}')">❌ Not received (cancel)</button></div></div>`:''}${o.payOk?`<small style="color:var(--ok)">✅ Payment verified ${o.payAt?fdt(o.payAt):''}</small><br>`:''}
  <select onchange="setStatus('${o.id}',+this.value)">${STATUS.map((s,i)=>`<option value="${i}" ${o.status===i?'selected':''}>${s}</option>`).join('')}</select>
  <div class="row" style="margin-top:6px"><button class="btn sm wa" onclick="window.open('https://wa.me/88${esc(o.phone)}','_blank')">গ্রাহককে WhatsApp</button>${o.sold?`<button class="btn sm g" onclick="receipt('${(D.sales.find(s=>s.ref===o.id)||{}).id}')">🖨️ রশিদ</button>`:''}</div></div>`).join(''):'<div class="empty">কোনো অনলাইন অর্ডার নেই</div>')+
  `<div style="font-size:12px;color:var(--mut)">কনফার্মড করলে স্টক কমবে; ডেলিভারড করলে বিক্রি ও লাভের হিসাবে যোগ হবে। স্ট্যাটাস কাস্টমারকে দেখাতে সেটিংস থেকে catalog.json আবার পাবলিশ করুন।</div>`;
}
function importOrder(){
  const m=/MSORDER:([A-Za-z0-9+/=]+)/.exec($('#imp').value);
  if(!m)return toast('মেসেজে MSORDER কোড পাওয়া যায়নি');
  try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o.id||!o.items)throw 0;
    if(addOrder(o)){sv();toast('✅ অর্ডার #'+o.id+' ইম্পোর্ট হয়েছে')}else toast('এই অর্ডার আগেই আছে');render()}
  catch(e){toast('কোডটি পড়া যায়নি')}
}
const needPay=o=>o.pay!=='cod'&&!o.payOk&&o.status===0;
function payOk(id){const o=D.orders.find(x=>x.id===id);if(!o)return;o.payOk=true;o.payAt=Date.now();setStatus(id,1);toast('✅ Payment OK — order '+id+' confirmed')}
function payNo(id){const o=D.orders.find(x=>x.id===id);if(!o)return;if(!confirm('Payment not received — cancel order '+id+'?'))return;setStatus(id,4)}
function setStatus(id,s){
  const o=D.orders.find(x=>x.id===id);if(!o)return;
  if(needPay(o)&&s>=1&&s<=3){toast('Verify the payment first (press "Payment received — OK")');return render()}
  if(o.sold&&s!==3){toast('ডেলিভারড অর্ডার বদলানো যায় না');return render()}
  if(s===4){if(o.stocked){o.items.forEach(i=>stockMove(i.pid,+i.qty,'ret','অর্ডার ক্যানসেল #'+o.id));o.stocked=false}}
  else if(s>=1&&!o.stocked){o.items.forEach(i=>stockMove(i.pid,-i.qty,'sale','অনলাইন অর্ডার #'+o.id));o.stocked=true}
  if(s===3&&!o.sold){
    D.billSeq=(D.billSeq||0)+1;
    const sl=buildSale(o.items.map(i=>({pid:i.pid,name:i.name,qty:+i.qty,price:+i.price})),o.disc||0,o.fee||0,o.pay,{id:'B'+pad(D.billSeq),t:Date.now(),src:'online',ref:o.id,cust:o.name,phone:o.phone,paidAt:Date.now()});
    sl.paidAmt=sl.total;postSale(sl);D.sales.unshift(sl);
    o.sold=true;
  }
  o.status=s;sv();render();
}

const blankL=()=>({a:'',d:'',c:'',ld:'',doc:'',rep:''});

function jeRes(raw){
  raw=String(raw||'').trim();if(!raw)return '';if(acct(raw))return raw;
  const f=raw.split(/\s*·\s*/)[0].trim();if(acct(f))return f;
  const q=raw.toLowerCase().replace(/^\d+\s*·?\s*/,''),m=D.accounts.filter(a=>a.name.toLowerCase().includes(q));
  return m.length===1?m[0].code:(m.find(a=>a.name.toLowerCase()===q)||{code:raw}).code;
}

function jeSync(){

function jeDC(i,f){jeSync();if(+jl[i][f])jl[i][f==='d'?'c':'d']='';render()}

function jeAdd(){
  jeSync();const td=sum(jl,l=>+l.d||0),tc=sum(jl,l=>+l.c||0),df=r2(td-tc),p=jl[jl.length-1]||blankL();

function jeLoad(id){
  const e=J(id);if(!e)return;
  jf={cc:e.cc||'',date:dateVal(e.t),post:e.posted,type:e.jt||'01',id:e.id,sim:'',ro:!!e.posted};

function jeGo(w){
  jeSync();const L=jMan();if(!L.length)return toast('কোনো ম্যানুয়াল এন্ট্রি নেই');
  let i=L.findIndex(e=>e.id===jf.id);
  if(w==='first')i=0;else if(w==='last')i=L.length-1;else if(w==='prev')i=i<0?L.length-1:Math.max(0,i-1);else i=i<0?0:Math.min(L.length-1,i+1);
  jeLoad(L[i].id);render();
}
function jeSim(){

function grouped(list,keyOf,rowOf,totOf,label){
  const rows=[];let cur=null,acc=null;
  const flush=()=>{if(cur!==null)rows.push(totOf(cur,acc))};
  list.forEach(o=>{const k=keyOf(o);if(k!==cur){flush();cur=k;acc={q:0,a:0}}rows.push(rowOf(o));acc.q+=o.q;acc.a=r2(acc.a+o.a)});
  flush();return rows;
}

  const l=Object.values(m).sort((a,b)=>a.c.localeCompare(b.c,'bn')||b.a-a.a);

/* ---- generic multi-line stock docs: adjustment / write-off ---- */
function adjApply(kind,br,L,note,reason){
  const lines=[];
  L.forEach(l=>{if(!l.qty)return;const p=P(l.pid);stockMove(p.id,l.qty,kind,note,p.cost);bqAdj(p,br,l.qty);lines.push({pid:p.id,name:p.name,code:p.code,cat:p.cat,sub:p.sub||'',qty:l.qty,cost:p.cost})});
  if(!lines.length)return null;
  const sur=r2(sum(lines.filter(l=>l.qty>0),l=>l.qty*l.cost)),sho=r2(sum(lines.filter(l=>l.qty<0),l=>-l.qty*l.cost));
  const id=stNo(kind,PFX[kind]);
  const e=jPost(kind,id,(kind==='wo'?'Write-off ':'Inventory Adjustment ')+id+' — '+note,[{a:AC().inv,d:sur},{a:'4200',c:sur},{a:'5200',d:sho},{a:AC().inv,c:sho}],{cc:br});
  const d={id,kind,t:Date.now(),branch:br,lines,reason:reason||'',note,val:r2(sur-sho),jid:e.id};D.st.docs.unshift(d);return d;
}
