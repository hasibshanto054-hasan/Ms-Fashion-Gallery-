<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Bengali","Segoe UI",sans-serif}

<body>

<script>
/* ===== MS Fashion — core ===== */
function _store(name){let real=null;try{real=window[name];real.getItem('__t')}catch(e){real=null}const m={};return{getItem:k=>{if(real){try{return real.getItem(k)}catch(e){}}return k in m?m[k]:null},setItem:(k,v)=>{m[k]=String(v);if(real){try{real.setItem(k,v)}catch(e){}}},removeItem:k=>{delete m[k];if(real){try{real.removeItem(k)}catch(e){}}}}}
const LS=_store('localStorage'),SS=_store('sessionStorage');
const $=s=>document.querySelector(s);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const tk=n=>'৳'+bn(Math.round(n).toLocaleString('en-US'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const STATUS=['পেন্ডিং','কনফার্মড','শিপড','ডেলিভারড','ক্যানসেলড'];
const OFN={weekly:'সাপ্তাহিক',monthly:'মাসিক'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function closeM(){const m=$('#modal');if(m)m.innerHTML=''}

/* ----- theme ----- */
function applyTheme(){
  const l=LS.getItem('msf_theme')==='light';
  document.body.classList.toggle('light',l);
  const b=$('#thb');if(b)b.textContent=l?'☀️':'🌙';
}
function toggleTheme(){try{LS.setItem('msf_theme',LS.getItem('msf_theme')==='light'?'dark':'light')}catch(e){}applyTheme()}

/* ----- EAN-13 barcode ----- */
function eanCheck(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return (10-s%10)%10}
function eanFromSeq(n){const b='200'+String(n).padStart(9,'0');return b+eanCheck(b)}
function eanValid(c){return /^\d{13}$/.test(String(c))&&+c[12]===eanCheck(String(c).slice(0,12))}
const _L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
const _G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
const _R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const _P=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function barcodeSVG(code,h){
  h=h||56;code=String(code);
  if(!eanValid(code))return `<div class="bc" style="font:12px monospace;color:#000;padding:8px">${esc(code)}</div>`;
  const d=code.split('').map(Number);
  let bits='101';
  for(let i=0;i<6;i++)bits+=(_P[d[0]][i]==='L'?_L:_G)[d[i+1]];
  bits+='01010';
  for(let i=7;i<13;i++)bits+=_R[d[i]];
  bits+='101';
  const m=2,q=10;let rects='',i=0;
  while(i<bits.length){
    if(bits[i]==='1'){let j=i;while(bits[j]==='1')j++;rects+=`<rect x="${(q+i)*m}" y="0" width="${(j-i)*m}" height="${h}"/>`;i=j}else i++;
  }
  const W=(95+q*2)*m;
  const t=(s,x)=>`<text x="${x}" y="${h+12}" text-anchor="middle" font-size="11" font-family="monospace" fill="#000">${s}</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${h+16}" style="width:100%;max-width:210px;background:#fff;border-radius:4px"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g>${t(code[0],(q-4)*m)}${t(code.slice(1,7),(q+24)*m)}${t(code.slice(7),(q+71)*m)}</svg>`;
}

/* ----- offers (call after setting OFFERS) ----- */
let OFFERS={};
function bestOffer(p){
  return ['weekly','monthly'].map(k=>({k,...(OFFERS[k]||{})}))
    .filter(o=>o.on&&o.end>Date.now()&&(!o.ids||!o.ids.length||o.ids.includes(p.id)))
    .sort((a,b)=>b.pct-a.pct)[0]||null;
}
function eff(p){const o=bestOffer(p);return o?Math.round(p.price*(1-o.pct/100)):p.price}
function discPct(p){const b=Math.max(p.old||0,p.price),e=eff(p);return b>e?Math.round((1-e/b)*100):0}
function priceHTML(p){
  const b=Math.max(p.old||0,p.price),e=eff(p),o=bestOffer(p);
  return tk(e)+(b>e?`<s>${tk(b)}</s>`:'')+(o?`<div style="font-size:11px;color:var(--ok);font-weight:600">🎁 ${OFN[o.k]} অফার -${bn(o.pct)}%</div>`:'');
}

/* ===== CLOUD (Firebase Realtime Database — REST) =====
   ⬇️ Firebase প্রজেক্ট খোলার পর শুধু এই লাইনে দুটি মান বসান (কাস্টমার ও অ্যাডমিন দুই অ্যাপেই একই মান) */
const CLOUD={apiKey:'',dbUrl:''};
try{if(!CLOUD.dbUrl){const x=new XMLHttpRequest();x.open('GET','cloud.json?'+Date.now(),false);x.send();if(x.status==200){const j=JSON.parse(x.responseText);if(j.apiKey)CLOUD.apiKey=j.apiKey;if(j.dbUrl)CLOUD.dbUrl=j.dbUrl}}}catch(e){}
const cloudOn=()=>!!(CLOUD.apiKey&&CLOUD.dbUrl);
const dbu=(path,tok,q)=>{const a=[];if(q)a.push(q);if(tok)a.push('auth='+encodeURIComponent(tok));return String(CLOUD.dbUrl).replace(/\/+$/,'')+'/'+path+'.json'+(a.length?'?'+a.join('&'):'')};
async function dbGet(path,tok,q){const r=await fetch(dbu(path,tok,q),{cache:'no-store'});if(!r.ok)throw new Error('GET '+path+' '+r.status);return r.json()}
async function dbPut(path,val,tok){const r=await fetch(dbu(path,tok),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(val)});if(!r.ok)throw new Error('PUT '+path+' '+r.status);return r.json()}

async function loadCloudCatalog(){
  const c=await dbGet('catalog');
  if(!c||!c.products)throw new Error('empty catalog');
  c.products=(Array.isArray(c.products)?c.products:Object.values(c.products)).filter(Boolean);
  c.products.forEach(p=>{
    p.sizes=p.sizes?(Array.isArray(p.sizes)?p.sizes:Object.values(p.sizes)):[];
    p.colors=p.colors?(Array.isArray(p.colors)?p.colors:Object.values(p.colors)):[];
    p.reviews=p.reviews?(Array.isArray(p.reviews)?p.reviews:Object.values(p.reviews)):[];
  });
  return c;
}
let _lt=null,_es=null,_stT=0,_tLoad=false;
function liveRefresh(){
  clearTimeout(_lt);
  _lt=setTimeout(async()=>{

  try{
    let first=true;_es=new EventSource(dbu('catalog'));
    const h=()=>{if(first){first=false;return}liveRefresh()};
    _es.addEventListener('put',h);_es.addEventListener('patch',h);
  }catch(e){}
  setInterval(liveRefresh,60000);

async function refreshStatus(){

const SYN={'shirt':'শার্ট','pant':'প্যান্ট','pants':'প্যান্ট','trouser':'প্যান্ট','saree':'শাড়ি','sari':'শাড়ি','jamdani':'জামদানি','panjabi':'পাঞ্জাবি','punjabi':'পাঞ্জাবি','hijab':'হিজাব','frock':'ফ্রক','jeans':'জিন্স','jean':'জিন্স','polo':'পোলো','tshirt':'টি-শার্ট','t-shirt':'টি-শার্ট','shoe':'জুতা','shoes':'জুতা','sneaker':'স্নিকার্স','sneakers':'স্নিকার্স','jacket':'জ্যাকেট','denim':'ডেনিম','men':'পুরুষ','man':'পুরুষ','mens':'পুরুষ','women':'নারী','woman':'নারী','ladies':'নারী','kids':'শিশু','kid':'শিশু','child':'শিশু','formal':'ফরমাল','casual':'ক্যাজুয়াল','chino':'চিনো','check':'চেক','oxford':'অক্সফোর্ড','three':'থ্রি','set':'সেট'};
const nrm=s=>String(s||'').toLowerCase().replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[()\[\],.\-_/]+/g,' ').replace(/\s+/g,' ').trim();
function hay(p){return nrm([p.name,p.cat,p.sub,p.code,p.desc,(p.sizes||[]).join(' '),p.price,eff(p)].join(' '))}
function tokens(q){return nrm(q).split(' ').filter(Boolean)}
function pScore(p,tk){
  const h=hay(p),nm=nrm(p.name);let s=0;
  for(const t of tk){
    const alts=[t];if(SYN[t])alts.push(nrm(SYN[t]));
    // bengali typed -> also english key
    Object.keys(SYN).forEach(k=>{if(nrm(SYN[k])===t)alts.push(k)});
    if(!alts.some(a=>h.includes(a)))return 0;
    s+=alts.some(a=>nm.startsWith(a))?5:alts.some(a=>nm.includes(a))?3:1;
  }
  return s+(p.stock>0?0.5:0);
}
function searchList(q){
  const tk=tokens(q);if(!tk.length)return CAT.products.slice();
  return CAT.products.map(p=>[p,pScore(p,tk)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

}

  const fee=!C.cart.length?0:(sub-disc>=CAT.set.freeAbove?0:CAT.set.delivery);
  return{sub,disc,fee,total:sub-disc+fee};
}

/* ----- AI assistant ----- */
let aiMsgs=[{role:'assistant',content:'আসসালামু আলাইকুম! 👋 আমি MS Fashion এর AI সহকারী। পোশাক, সাইজ, দাম বা ডেলিভারি নিয়ে যেকোনো প্রশ্ন করুন।'}];
function toggleAI(){$('#aiw').classList.toggle('open');drawAI()}
function drawAI(){const b=$('#aim');b.innerHTML=aiMsgs.map(m=>`<div class="bb ${m.role==='user'?'u':'a'}">${esc(m.content)}</div>`).join('');b.scrollTop=b.scrollHeight}
async function sendAI(e){
  e.preventDefault();const i=$('#aii'),t=i.value.trim();if(!t)return false;i.value='';
  aiMsgs.push({role:'user',content:t});drawAI();
  aiMsgs.push({role:'assistant',content:'...'});drawAI();
  let r=null;
  if(CAT.set.ai){
    try{
      const res=await fetch(CAT.set.ai,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:aiMsgs.slice(0,-1).slice(-10),shop:{coupon:CAT.set.coupon,pct:CAT.set.pct,delivery:CAT.set.delivery,freeAbove:CAT.set.freeAbove,products:CAT.products.map(p=>({name:p.name,price:eff(p),cat:p.cat,sizes:p.sizes}))}})});
      r=(await res.json()).reply;
    }catch(err){r=null}
  }
  aiMsgs[aiMsgs.length-1].content=r||localAI(t);drawAI();return false;
}
function localAI(t){
  const q=t.toLowerCase();
  if(/ডেলিভারি|delivery|কত দিন|কবে/.test(q))return `ঢাকায় ২-৩ দিন, ঢাকার বাইরে ৩-৫ দিনে ডেলিভারি হয়। ডেলিভারি চার্জ ${tk(CAT.set.delivery)}, ${tk(CAT.set.freeAbove)} এর বেশি কেনাকাটায় ফ্রি।`;
  if(/পেমেন্ট|bkash|বিকাশ|নগদ|nagad|rocket|ক্যাশ/.test(q))return 'bKash, Nagad, Rocket ও ক্যাশ অন ডেলিভারি — চারটি পদ্ধতিতেই পেমেন্ট করা যায়।';
  if(/কুপন|ছাড়|অফার|discount|coupon|offer/.test(q)){
    const a=['weekly','monthly'].filter(k=>OFFERS[k]&&OFFERS[k].on&&OFFERS[k].end>Date.now()).map(k=>`🎁 ${OFFERS[k].title}: ${bn(OFFERS[k].pct)}% ছাড়`);
    a.push(`কুপন ${CAT.set.coupon} দিলে ${bn(CAT.set.pct)}% ছাড় (কার্ট পেজে বসান)।`);return a.join('\n');
  }
  if(/সাইজ|size|মাপ/.test(q))return 'প্রতিটি পণ্যের পেজে সাইজ অপশন আছে। সাইজ নিয়ে দ্বিধায় থাকলে উচ্চতা ও ওজন জানান, সাজেস্ট করব।';
  if(/রিটার্ন|ফেরত|exchange|return/.test(q))return 'পণ্য হাতে পেয়ে ৩ দিনের মধ্যে সাইজ/ত্রুটির কারণে এক্সচেঞ্জ করা যাবে।';
  const num=(q.match(/\d+/g)||[]).map(Number)[0]||(q.match(/[০-৯]+/g)||[]).map(s=>+s.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)))[0];
  let l=CAT.products.filter(p=>(p.stock||0)>0&&q.split(/\s+/).some(w=>w.length>1&&(p.name+p.cat).toLowerCase().includes(w)));
  if(!l.length&&num)l=CAT.products.filter(p=>(p.stock||0)>0&&eff(p)<=num);
  if(num&&l.length)l=l.filter(p=>eff(p)<=num);
  if(l.length)return 'আপনার জন্য কিছু সাজেশন:\n'+l.slice(0,4).map(p=>`• ${p.name} — ${tk(eff(p))}`).join('\n')+'\n\nহোম পেজে গিয়ে দেখে নিতে পারেন।';
  return 'দুঃখিত, বুঝতে পারিনি। আপনি পণ্যের নাম, বাজেট (যেমন "১০০০ টাকার মধ্যে") বা ডেলিভারি/পেমেন্ট/কুপন নিয়ে জিজ্ঞেস করতে পারেন।';
}
